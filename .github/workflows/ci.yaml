name: Run tests

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yaml"
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

jobs:
  test:
    name: Run tests (${{ matrix.toolchain }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly
          - 1.98.0 # msrv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
          build-warnings: warn
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Run tests without default features
        run: |
          cargo test -p bottlecap --no-default-features
          cargo test -p bottlecap-tower --no-default-features
          cargo test -p bottlecap-tower --no-default-features --features axum
          cargo test -p bottlecap-tower --no-default-features --features tonic
          cargo test -p bottlecap-actix-web --no-default-features
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -W warnings
      - name: Run fmt
        run: cargo fmt --all -- --check
        continue-on-error: true
