[package]
name = "bottlecap"
version = "0.0.0"
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[workspace]
resolver = "3"
members = []
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
homepage = "https://github.com/explodingcamera/bottlecap"
repository = "https://github.com/explodingcamera/bottlecap"
license = "MIT OR Apache-2.0"

[dependencies]
coarsetime = { version = "0.1.38", default-features = false, optional = true }

[features]
default = ["coarsetime"]
coarsetime = ["dep:coarsetime"]
