[package]
name = "bottlecap"
version.workspace = true
description = "A fast, memory-efficient rate limiter for Rust"
keywords = ["rate-limit", "rate-limiter", "throttle", "gcra"]
categories = ["algorithms", "concurrency", "network-programming"]
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
repository.workspace = true
license.workspace = true

[features]
default = ["coarsetime", "default-hasher"]
coarsetime = ["dep:coarsetime"]
default-hasher = ["dep:rapidhash"]

[dependencies]
coarsetime = { workspace = true, optional = true }
hashbrown.workspace = true
rapidhash = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["time"] }
